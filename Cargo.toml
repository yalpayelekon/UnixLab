[workspace]
members = ["apps/*", "libs/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/yalpayelekon/UnixLab"
rust-version = "1.85"

[workspace.dependencies]
regex = "1.13.1"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
unixlab-cli = { path = "libs/cli" }
unixlab-common = { path = "libs/common" }
unixlab-errors = { path = "libs/errors" }
unixlab-fs = { path = "libs/fs" }
unixlab-logging = { path = "libs/logging" }
unixlab-terminal = { path = "libs/terminal" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
module_name_repetitions = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
